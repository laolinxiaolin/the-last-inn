<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- GRIB — the goblin. Small, neat, olive-green, big careful ears, tidy
       brown vest. Sits small with his hands on the table where you can see
       them. The politest guest you've ever had. -->
  <defs>
    <style>
      .ol{stroke:#26301C;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .olt{stroke:#26301C;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- the table, and his hands where you can see them -->
  <path d="M0 448 h512 v64 h-512 Z" fill="#5C3A21"/>
  <path d="M0 448 h512 v16 h-512 Z" fill="#7A5230" class="olt"/>
  <path d="M120 468 v44 M260 468 v44 M400 468 v44" stroke="#4A2E18" stroke-width="5"/>

  <!-- small neat body: tidy brown vest, cream shirt -->
  <path d="M168 448 C 176 396 210 374 256 374 C 302 374 336 396 344 448 Z" fill="#6B4A2F" class="ol"/>
  <path d="M226 378 L256 408 L286 378 L286 372 L226 372 Z" fill="#F2E3C5" class="olt"/>
  <path d="M238 384 L256 400 L274 384" stroke="#D9C9A0" stroke-width="4" fill="none"/>
  <circle cx="256" cy="424" r="6" fill="#C9A35C" class="olt"/>

  <!-- two small careful hands, side by side, where you can see them -->
  <g fill="#7A9455" class="olt">
    <path d="M196 450 C 190 426 200 410 220 410 C 238 410 246 426 244 450 Z"/>
    <path d="M268 450 C 266 426 274 410 292 410 C 312 410 322 426 316 450 Z"/>
  </g>
  <path d="M212 418 v14 M222 416 v16 M232 418 v13 M280 418 v13 M290 416 v16 M300 418 v14" stroke="#5F7A44" stroke-width="4" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="236" y="330" width="40" height="52" rx="14" fill="#7A9455"/>

  <!-- the big careful ears, held politely low -->
  <g class="ol">
    <path d="M158 236 C 104 214 58 226 42 270 C 34 296 46 320 76 326 C 116 332 150 300 162 262 Z" fill="#7A9455"/>
    <path d="M354 236 C 408 214 454 226 470 270 C 478 296 466 320 436 326 C 396 332 362 300 350 262 Z" fill="#7A9455"/>
  </g>
  <path d="M146 252 C 110 238 82 246 70 274 C 64 290 72 306 90 310" stroke="#A8BF7E" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M366 252 C 402 238 430 246 442 274 C 448 290 440 306 422 310" stroke="#A8BF7E" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- smooth round head -->
  <path d="M256 128 C 336 128 362 184 362 250 C 362 318 322 366 256 366 C 190 366 150 318 150 250 C 150 184 176 128 256 128 Z" fill="#7A9455" class="ol"/>
  <path d="M186 176 C 204 146 236 134 266 138 C 232 144 206 162 194 190 Z" fill="#8DAA66"/>
  <path d="M330 198 C 344 234 340 300 306 340 C 330 312 340 262 334 220 Z" fill="#5F7A44" opacity="0.6"/>

  <!-- one tidy cowlick -->
  <path d="M252 126 C 246 104 262 92 276 98 C 262 100 258 112 264 122" stroke="#26301C" stroke-width="6" fill="#5F7A44"/>

  <!-- big earnest amber eyes -->
  <ellipse cx="214" cy="252" rx="29" ry="32" fill="#FFFFFF" class="olt"/>
  <ellipse cx="298" cy="252" rx="29" ry="32" fill="#FFFFFF" class="olt"/>
  <circle cx="216" cy="258" r="17" fill="#C98A2D"/>
  <circle cx="296" cy="258" r="17" fill="#C98A2D"/>
  <circle cx="216" cy="260" r="8" fill="#1A1A1A"/>
  <circle cx="296" cy="260" r="8" fill="#1A1A1A"/>
  <circle cx="223" cy="250" r="6" fill="#FFFFFF"/>
  <circle cx="303" cy="250" r="6" fill="#FFFFFF"/>
  <circle cx="209" cy="266" r="3" fill="#FFFFFF"/>
  <circle cx="289" cy="266" r="3" fill="#FFFFFF"/>

  <!-- brows raised in earnest gratitude -->
  <path d="M188 210 Q214 196 242 212" stroke="#26301C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M270 212 Q298 196 324 210" stroke="#26301C" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- hopeful little nose -->
  <path d="M248 294 Q256 304 264 296" stroke="#5F7A44" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- the polite smile -->
  <path d="M230 326 Q256 342 282 326" stroke="#3E5230" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M222 320 q-6 2 -8 8 M290 320 q6 2 8 8" stroke="#3E5230" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- gentle blush -->
  <ellipse cx="190" cy="300" rx="16" ry="9" fill="#9AB36A" opacity="0.8"/>
  <ellipse cx="322" cy="300" rx="16" ry="9" fill="#9AB36A" opacity="0.8"/>
</svg>
