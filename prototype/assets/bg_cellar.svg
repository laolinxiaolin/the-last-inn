<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- THE CELLAR — night three's capstone. Stone, kegs breathing, one lamp,
       and a locked door at the far end. Two lights: the lamp (amber) and a cold
       seam seeping from the door's wrongness. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2730"/>
      <stop offset="100%" stop-color="#17151C"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A42"/>
      <stop offset="100%" stop-color="#1E1E26"/>
    </linearGradient>
    <radialGradient id="lamplight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#C97B2D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#17151C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorleak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A6B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- walls -->
  <rect width="1920" height="780" fill="url(#stone)"/>
  <!-- stone courses -->
  <g stroke="#101018" stroke-width="5" opacity="0.8">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="0" y1="640" x2="1920" y2="640"/>
    <line x1="0" y1="740" x2="1920" y2="740"/>
    <line x1="300" y1="0" x2="300" y2="120"/>
    <line x1="700" y1="120" x2="700" y2="240"/>
    <line x1="200" y1="240" x2="200" y2="360"/>
    <line x1="1200" y1="120" x2="1200" y2="240"/>
    <line x1="1500" y1="240" x2="1500" y2="360"/>
    <line x1="1650" y1="0" x2="1650" y2="120"/>
  </g>

  <!-- vaulted stone arches overhead -->
  <path d="M0 0 Q480 300 960 220 Q1440 300 1920 0" fill="#232129" opacity="0.9"/>
  <path d="M0 0 Q480 340 960 260 Q1440 340 1920 0 L1920 0 L0 0 Z" fill="#1E1C24"/>

  <!-- the far door: wrong, shut -->
  <g>
    <rect x="720" y="170" width="480" height="570" fill="#0E0C12"/>
    <rect x="745" y="195" width="430" height="520" fill="#241C20"/>
    <rect x="745" y="195" width="430" height="520" fill="none" stroke="#33282C" stroke-width="10"/>
    <path d="M745 350 L1175 350 L1175 715 L745 715 Z" fill="#171520"/>
    <!-- seam of cold light under and around it -->
    <rect x="720" y="700" width="480" height="26" fill="url(#doorleak)"/>
    <path d="M760 350 L1160 350 L1160 715 L760 715 Z" fill="none" stroke="#3A4A6B" stroke-width="3" opacity="0.5"/>
    <!-- iron bindings -->
    <rect x="745" y="410" width="450" height="18" fill="#3A3A45"/>
    <rect x="745" y="560" width="450" height="18" fill="#3A3A45"/>
    <rect x="880" y="195" width="10" height="500" fill="#3A3A45"/>
    <rect x="1050" y="195" width="10" height="500" fill="#3A3A45"/>
    <!-- the lock, keyhole catching a thread of light -->
    <circle cx="1000" cy="300" r="26" fill="#3A3A45"/>
    <circle cx="1000" cy="300" r="12" fill="#0A0F18"/>
    <path d="M1000 312 L1000 336" stroke="#0A0F18" stroke-width="8"/>
  </g>

  <!-- kegs, left -->
  <g>
    <ellipse cx="330" cy="810" rx="150" ry="40" fill="#3A2A1C"/>
    <rect x="180" y="520" width="300" height="290" rx="60" fill="#5C3A21"/>
    <rect x="180" y="520" width="300" height="290" rx="60" fill="none" stroke="#3A2A1C" stroke-width="8"/>
    <ellipse cx="330" cy="560" rx="150" ry="36" fill="#6B4A2A"/>
    <ellipse cx="330" cy="792" rx="150" ry="34" fill="#4A3226"/>
    <rect x="240" y="650" width="180" height="26" rx="8" fill="#3A2A1C"/>
    <path d="M330 520 L330 470" stroke="#3A2A1C" stroke-width="12"/>
    <circle cx="330" cy="452" r="20" fill="#3A2A1C"/>
  </g>
  <ellipse cx="520" cy="880" rx="110" ry="26" fill="#33281E"/>
  <rect x="410" y="720" width="220" height="180" rx="46" fill="#4A3226"/>
  <rect x="410" y="720" width="220" height="180" rx="46" fill="none" stroke="#2E2016" stroke-width="7"/>
  <rect x="470" y="760" width="100" height="20" rx="6" fill="#2E2016"/>

  <!-- kegs, right -->
  <g>
    <rect x="1460" y="600" width="260" height="250" rx="52" fill="#5C3A21"/>
    <rect x="1460" y="600" width="260" height="250" rx="52" fill="none" stroke="#3A2A1C" stroke-width="7"/>
    <ellipse cx="1590" cy="628" rx="130" ry="24" fill="#6A4A2A"/>
    <rect x="1518" y="700" width="144" height="22" rx="7" fill="#3A2A1C"/>
    <circle cx="1590" cy="588" r="16" fill="#3A2A1C"/>
  </g>
  <ellipse cx="1740" cy="820" rx="120" ry="30" fill="#1E1C24"/>
  <rect x="1640" y="680" width="200" height="150" rx="48" fill="#4A3226"/>
  <rect x="1640" y="680" width="200" height="150" rx="48" fill="none" stroke="#2A2016" stroke-width="7"/>

  <!-- the hanging lamp: one warm pool on the stone -->
  <g>
    <path d="M960 0 L960 260" stroke="#0E0C12" stroke-width="8"/>
    <path d="M880 260 L1040 260 L1020 330 L900 330 Z" fill="#C97B2D"/>
    <rect x="930" y="300" width="60" height="70" rx="14" fill="#E8A33D"/>
    <path d="M948 360 q12 40 -4 60" stroke="#E8A33D" stroke-width="6" fill="none"/>
    <ellipse cx="960" cy="430" rx="520" ry="150" fill="url(#lamplight)"/>
  </g>

  <!-- flagstones -->
  <rect y="760" width="1920" height="320" fill="url(#flag)"/>
  <g stroke="#14121A" stroke-width="6" opacity="0.8">
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="880" x2="1920" y2="880"/>
    <line x1="0" y1="980" x2="1920" y2="980"/>
    <line x1="320" y1="760" x2="320" y2="800"/>
    <line x1="900" y1="800" x2="900" y2="880"/>
    <line x1="1500" y1="880" x2="1500" y2="980"/>
    <line x1="640" y1="980" x2="640" y2="1080"/>
  </g>
  <!-- a dropped iron key near the door -->
  <g transform="translate(1280 830) rotate(25)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#8A8A85" stroke-width="8"/>
    <rect x="14" y="-4" width="70" height="9" rx="4" fill="#8A8A85"/>
    <path d="M66 4 L66 22 M78 4 L78 24" stroke="#8A8A85" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
