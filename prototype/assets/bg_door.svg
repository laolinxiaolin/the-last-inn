<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- THE DOOR — the threshold to the world, and the world coming to you.
       A great wooden door in a stone arch, opening on the night. The lamp
       pools warm on the flags; the dark beyond is nearly absolute. -->
  <defs>
    <linearGradient id="outside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#1E2A42"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4338"/>
      <stop offset="100%" stop-color="#2A241C"/>
    </linearGradient>
    <radialGradient id="lamppool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#C97B2D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#17151C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- stone arch / jamb -->
  <rect width="1920" height="1080" fill="url(#stone)"/>
  <rect x="500" y="0" width="920" height="1080" fill="#2A241C"/>

  <!-- the open night beyond -->
  <rect x="500" y="0" width="920" height="1080" fill="url(#outside)"/>
  <ellipse cx="960" cy="360" rx="220" ry="220" fill="#0B0F1A" opacity="0.8"/>
  <circle cx="900" cy="280" r="3" fill="#D9DEE3" opacity="0.5"/>
  <circle cx="1060" cy="300" r="2.5" fill="#D9DEE3" opacity="0.4"/>
  <circle cx="980" cy="420" r="3" fill="#D9DEE3" opacity="0.5"/>

  <!-- the great door, swung ajar -->
  <g>
    <path d="M500 80 Q960 -60 1420 80 L1420 1080 L500 1080 Z" fill="#241C20"/>
    <path d="M500 80 Q960 -60 1420 80 L1420 1080 L500 1080 Z" fill="none" stroke="#3A2C30" stroke-width="14"/>
    <!-- door leaf (ajar on the left) -->
    <path d="M500 110 L640 110 L700 1080 L500 1080 Z" fill="#3E2A1C"/>
    <path d="M640 110 L660 110 L730 1080 L700 1080 Z" fill="#332314"/>
    <!-- iron bands on the ajar leaf -->
    <rect x="540" y="320" width="120" height="16" fill="#3A3A45"/>
    <rect x="560" y="560" width="120" height="16" fill="#3A3A45"/>
    <!-- the darkness just past the door's edge -->
    <path d="M660 120 L1420 80 L1420 1080 L730 1080 Z" fill="#0B0F1A" opacity="0.55"/>
  </g>

  <!-- stone jamb highlights -->
  <g stroke="#5C5244" stroke-width="5" opacity="0.5">
    <path d="M500 80 L500 600" fill="none"/>
    <path d="M1420 80 L1420 1080" fill="none"/>
  </g>

  <!-- lamp by the door, warm pool on the flags -->
  <g>
    <path d="M1580 1080 L1580 700 L1660 700 L1660 1080 Z" fill="#2A2410"/>
    <path d="M1580 700 Q1620 680 1660 700 L1660 1080 L1580 1080 Z" fill="#3A2A1C"/>
    <rect x="1600" y="620" width="40" height="60" rx="10" fill="#C97B2D"/>
    <path d="M1606 650 q14 60 -2 90" stroke="#E8A33D" stroke-width="6" fill="none"/>
    <ellipse cx="1560" cy="900" rx="420" ry="150" fill="url(#lamppool)"/>
    <circle cx="1620" cy="610" r="22" fill="#E8A33D"/>
  </g>

  <!-- a shadow at the threshold where none should be -->
  <ellipse cx="900" cy="1030" rx="180" ry="30" fill="#04060C" opacity="0.7"/>
  <path d="M820 1080 L860 960 L960 940 L1060 960 L1100 1080 Z" fill="#05070E" opacity="0.9"/>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
