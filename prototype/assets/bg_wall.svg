<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- THE WALL — the living museum given a room. Every keepsake hangs because of
       a choice the player made. Two lights: warm sconce light and a high cold
       moonlight from a single small window. -->
  <defs>
    <linearGradient id="wainscot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3322"/>
      <stop offset="100%" stop-color="#2E2016"/>
    </linearGradient>
    <radialGradient id="sconce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#C97B2D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2E2016" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A6B"/>
      <stop offset="100%" stop-color="#141B2C"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- the room -->
  <rect width="1920" height="680" fill="#33281E"/>

  <!-- the long wall of keepsakes -->
  <g>
    <rect x="0" y="60" width="1920" height="620" fill="#4A3322"/>
    <rect x="0" y="60" width="1920" height="620" fill="none" stroke="#2E2016" stroke-width="10"/>
    <!-- a fine brass line where things hang -->
    <path d="M80 210 L1840 210" stroke="#8A8A85" stroke-width="6" opacity="0.5"/>

    <!-- her sword in grey -->
    <g transform="translate(300 210) rotate(-6)">
      <rect x="-8" y="0" width="16" height="240" fill="#B8B8B2"/>
      <rect x="-20" y="-6" width="40" height="18" rx="6" fill="#8A8A85"/>
      <rect x="-26" y="-34" width="52" height="26" rx="8" fill="#8A8A85"/>
    </g>
    <!-- the borrowed sword too big for a boy -->
    <g transform="translate(560 200) rotate(5)">
      <rect x="-9" y="0" width="18" height="280" fill="#9A9A92"/>
      <rect x="-22" y="-8" width="44" height="20" rx="6" fill="#6B4A2F"/>
      <rect x="-30" y="-40" width="60" height="30" rx="10" fill="#6B4A2F"/>
      <circle cx="0" cy="-66" r="18" fill="#6B4A2F"/>
    </g>
    <!-- a road hat -->
    <g transform="translate(850 235)">
      <ellipse cx="0" cy="0" rx="90" ry="22" fill="#5C4A3A"/>
      <path d="M-70 0 L-55 -110 Q0 -140 55 -110 L70 0 Z" fill="#6B4A2F"/>
      <rect x="-46" y="-120" width="92" height="20" fill="#4A3A2C"/>
    </g>
    <!-- a coin too new -->
    <circle cx="1060" cy="250" r="34" fill="#D9D9D3"/>
    <circle cx="1060" cy="250" r="26" fill="#C9C9C2"/>
    <!-- the bell key -->
    <g transform="translate(1250 210)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#C9A35C" stroke-width="14"/>
      <rect x="22" y="-6" width="90" height="12" rx="5" fill="#C9A35C"/>
      <path d="M96 6 L96 34 M112 6 L112 38" stroke="#C9A35C" stroke-width="11" stroke-linecap="round"/>
    </g>
    <!-- Grib's candle -->
    <g transform="translate(1460 250)">
      <rect x="-14" y="-120" width="28" height="120" rx="10" fill="#F2E3C5"/>
      <path d="M-10 -120 Q0 -138 10 -120 Z" fill="#E8A33D"/>
      <rect x="-24" y="0" width="48" height="16" rx="6" fill="#8C4A1F"/>
    </g>
    <!-- a broken lute string / keepsake -->
    <g transform="translate(1680 215) rotate(-3)">
      <path d="M-60 60 Q0 -70 60 60" stroke="#6B4A2F" stroke-width="16" fill="none"/>
      <path d="M-60 60 L-70 70 M60 60 L70 70" stroke="#6B4A2F" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>

  <!-- sconces, warm -->
  <g>
    <path d="M140 60 L170 60 L170 90 L140 90 Z" fill="#3A2A1C"/>
    <ellipse cx="155" cy="96" rx="18" ry="26" fill="#E8A33D"/>
    <rect x="130" y="60" width="220" height="260" fill="url(#sconce)"/>
    <path d="M1780 60 L1750 60 L1750 90 L1780 90 Z" fill="#3A2A1C"/>
    <ellipse cx="1765" cy="96" rx="18" ry="26" fill="#E8A33D"/>
    <rect x="1660" y="60" width="220" height="260" fill="url(#sconce)"/>
  </g>

  <!-- a single high window: the world's pale eye on the room -->
  <g>
    <rect x="990" y="40" width="120" height="200" rx="10" fill="#2B1D14"/>
    <rect x="1002" y="52" width="96" height="176" rx="6" fill="url(#moonglass)"/>
    <circle cx="1040" cy="100" r="18" fill="#E8E0C5" opacity="0.85"/>
    <rect x="990" y="40" width="120" height="200" rx="10" fill="none" stroke="#2E2016" stroke-width="12"/>
  </g>

  <!-- wood floor -->
  <g>
    <rect y="680" width="1920" height="400" fill="#3A2A1C"/>
    <g stroke="#2B1D14" stroke-width="6" opacity="0.8">
      <line x1="0" y1="680" x2="1920" y2="680"/>
      <line x1="0" y1="760" x2="1920" y2="760"/>
      <line x1="0" y1="860" x2="1920" y2="860"/>
      <line x1="0" y1="980" x2="1920" y2="980"/>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
