<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- RENN — the kid. 17, lanky, straw-brown messy hair, worn blue tunic,
       eyes too big for his face, borrowed sword hilt over his shoulder. -->
  <defs>
    <style>
      .ol{stroke:#2E2016;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .olt{stroke:#2E2016;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- borrowed sword hilt, too big for a boy, riding over his shoulder -->
  <g transform="rotate(-14 122 250)">
    <rect x="105" y="196" width="34" height="104" rx="14" fill="#5C3A21" class="ol"/>
    <path d="M105 214 L139 210 M105 236 L139 232 M105 258 L139 254" stroke="#3E2817" stroke-width="5"/>
    <rect x="80" y="172" width="84" height="22" rx="11" fill="#8A8A85" class="ol"/>
    <circle cx="124" cy="306" r="17" fill="#8A8A85" class="ol"/>
    <circle cx="124" cy="306" r="7" fill="#5C3A21"/>
  </g>

  <!-- worn blue tunic -->
  <path d="M48 512 C 74 398 152 366 256 366 C 360 366 438 398 464 512 Z" fill="#3B5B8C" class="ol"/>
  <path d="M48 512 C 70 414 128 378 196 370 C 150 396 122 440 116 512 Z" fill="#2E4770"/>
  <!-- sword strap across the chest -->
  <path d="M132 512 L286 372 L316 372 L162 512 Z" fill="#4A3226" class="olt"/>
  <circle cx="238" cy="438" r="9" fill="#8A8A85" class="olt"/>
  <!-- collar flaps + lacing -->
  <path d="M214 366 L256 410 L224 442 L200 384 Z" fill="#51719E" class="olt"/>
  <path d="M298 366 L256 410 L288 442 L312 384 Z" fill="#51719E" class="olt"/>
  <path d="M232 416 L280 416 M238 436 L274 436" stroke="#E8D5AC" stroke-width="5"/>
  <!-- shoulder patch, re-stitched -->
  <path d="M346 452 h54 v44 h-54 Z" fill="#2E4770" class="olt" stroke-dasharray="8 6"/>

  <!-- neck -->
  <rect x="226" y="318" width="60" height="72" rx="20" fill="#E8C9A0"/>
  <path d="M226 324 h60 v14 c-20 16 -40 16 -60 0 Z" fill="#D9B08C"/>

  <!-- ears -->
  <ellipse cx="142" cy="256" rx="16" ry="23" fill="#F2D8B8" class="olt"/>
  <ellipse cx="370" cy="256" rx="16" ry="23" fill="#F2D8B8" class="olt"/>

  <!-- face -->
  <path d="M256 116 C 332 116 366 168 366 244 C 366 318 324 368 256 368 C 188 368 146 318 146 244 C 146 168 180 116 256 116 Z" fill="#F2D8B8" class="ol"/>
  <path d="M342 196 C 356 232 352 300 316 340 C 344 312 362 268 356 220 Z" fill="#E2B48E"/>

  <!-- messy straw hair -->
  <path d="M168 138 L152 78 L196 112 L212 58 L246 106 L264 52 L296 108 L316 66 L344 130 L344 160 L168 160 Z" fill="#D9B36C" class="ol"/>
  <path d="M150 262 C 140 142 194 94 256 94 C 318 94 372 142 362 262 C 354 214 340 180 322 172 C 328 204 314 222 296 222 C 302 196 292 172 276 162 C 266 192 234 202 214 190 C 206 172 194 168 184 174 C 166 186 154 216 150 262 Z" fill="#D9B36C" class="ol"/>
  <path d="M322 172 C 328 204 314 222 296 222 C 302 196 292 172 276 162 Z" fill="#C49A50"/>
  <path d="M214 190 C 234 202 266 192 276 162 C 266 196 236 208 214 196 Z" fill="#C49A50"/>
  <path d="M184 174 C 166 186 154 216 150 262 L166 262 C 168 224 176 196 192 182 Z" fill="#C49A50"/>

  <!-- eyes: too big for his face -->
  <ellipse cx="212" cy="262" rx="28" ry="33" fill="#FFFFFF" class="olt"/>
  <ellipse cx="300" cy="262" rx="28" ry="33" fill="#FFFFFF" class="olt"/>
  <ellipse cx="214" cy="268" rx="17" ry="20" fill="#5B8C5A"/>
  <ellipse cx="298" cy="268" rx="17" ry="20" fill="#5B8C5A"/>
  <path d="M214 253 a17 20 0 0 1 15 9 a17 20 0 0 0 -30 6 a17 20 0 0 1 15 -15 Z" fill="#3E6440"/>
  <path d="M298 253 a17 20 0 0 1 15 9 a17 20 0 0 0 -30 6 a17 20 0 0 1 15 -15 Z" fill="#3E6440"/>
  <circle cx="214" cy="270" r="8" fill="#1A1A1A"/>
  <circle cx="298" cy="270" r="8" fill="#1A1A1A"/>
  <circle cx="221" cy="260" r="5.5" fill="#FFFFFF"/>
  <circle cx="305" cy="260" r="5.5" fill="#FFFFFF"/>
  <circle cx="208" cy="276" r="3" fill="#FFFFFF"/>
  <circle cx="292" cy="276" r="3" fill="#FFFFFF"/>
  <path d="M188 244 Q212 224 240 240" stroke="#2E2016" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M272 240 Q300 224 324 244" stroke="#2E2016" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- brows: eager, raised -->
  <path d="M186 218 Q214 202 246 216" stroke="#8C6B3A" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M266 216 Q298 202 326 218" stroke="#8C6B3A" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M250 300 Q256 308 264 302" stroke="#B98A5E" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- eager open grin -->
  <path d="M220 326 Q256 336 292 326 Q288 360 256 362 Q224 360 220 326 Z" fill="#7A332A" class="olt"/>
  <path d="M226 328 Q256 336 286 328 L282 342 Q256 348 230 342 Z" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="186" cy="306" rx="19" ry="10" fill="#E8A39A" opacity="0.5"/>
  <ellipse cx="326" cy="306" rx="19" ry="10" fill="#E8A39A" opacity="0.5"/>

  <!-- stray strand -->
  <path d="M330 176 C 346 200 350 224 346 248" stroke="#C49A50" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
